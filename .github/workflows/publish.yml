name: Publish Shiorune reader

# Manual publishing only. Editing the private source never triggers CI or deployment.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: velune-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout public reader
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check private repository token
        env:
          SOURCE_TOKEN: ${{ secrets.LYTHIA_READ_TOKEN || secrets.REVALNA_READ_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Set LYTHIA_READ_TOKEN (or legacy REVALNA_READ_TOKEN) as an Actions secret first."
            exit 1
          fi

      - name: Checkout private work library
        uses: actions/checkout@v4
        with:
          repository: pino1472/Lythia
          ref: main
          path: _source
          token: ${{ secrets.LYTHIA_READ_TOKEN || secrets.REVALNA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            works
          sparse-checkout-cone-mode: true

      - name: Check for unpublished updates
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SOURCE_TREE="$(git -C _source rev-parse HEAD:works)"
          READER_TREE="$(git rev-parse HEAD:reader)"
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "reader_tree=$READER_TREE" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != "workflow_dispatch" ] &&
             curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' \
               "https://shiorune.github.io/publication-revision.json?run=${GITHUB_RUN_ID}" \
               -o "$RUNNER_TEMP/publication-revision.json" &&
             python3 reader/publication_revision.py check "$RUNNER_TEMP/publication-revision.json" \
               "$SOURCE_TREE" "$READER_TREE"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No changes to published sources. Skipping CI and deploy."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "New source or reader revision. Running CI and deploy."
          fi

      - name: Set up Python
        if: steps.revision.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install generator dependencies
        if: steps.revision.outputs.publish == 'true'
        run: python -m pip install -r requirements.txt

      - name: Test novel-only build and exclusions
        if: steps.revision.outputs.publish == 'true'
        run: |
          python reader/test_publication_revision.py
          python reader/test_build.py
          node --check reader/reader.js
          node reader/test_reset.js
          node reader/test_episode_swipe.js

      - name: Generate all published works and their episodes
        if: steps.revision.outputs.publish == 'true'
        run: |
          python reader/build.py
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/works/revalna/index.html
          if find dist -type f \( -name '*.md' -o -name '*.yml' -o -name '*.yaml' \) | grep -q .; then
            echo "::error::Unexpected source or metadata file in public output."
            exit 1
          fi

      - name: Record successful-publication fingerprint
        if: steps.revision.outputs.publish == 'true'
        env:
          SOURCE_TREE: ${{ steps.revision.outputs.source_tree }}
          READER_TREE: ${{ steps.revision.outputs.reader_tree }}
        run: python3 reader/publication_revision.py write dist/publication-revision.json "$SOURCE_TREE" "$READER_TREE"

      - name: Configure GitHub Pages
        if: steps.revision.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload ONLY the generated public pages
        if: steps.revision.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.revision.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
