name: Verify Shiorune reader

# Test once when a PR is marked ready; do not run for every commit.
on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile reader/build.py reader/test_build.py
      - run: python reader/test_build.py
      - run: node --check reader/reader.js
      - run: node reader/test_reset.js
